ktor:
  application:
    modules:
      - ru.alexbur.backend.ApplicationKt.module
  deployment:
    port: 8080

postgres:
  url: ${POSTGRES_URL}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  issuer: "fitness-manager-backend"
  audience: "FitnessManagerApp"
  realm: "access"
